[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/readyz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Go allows 10 seconds for graceful shutdown.
drainingSeconds = 20

# SQLite and its attached volume have exactly one writer/service replica.
[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
